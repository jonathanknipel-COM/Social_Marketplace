<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareIt - Home</title>
    <link rel="stylesheet" href="css/auth-style.css">
</head>
<body>

    <!-- Semantic tags: header, nav -->
    <header class="main-header">
        <img src="./assets/Shareit-Logo.png" alt="ShareIt logo" style="width: 350px; height: auto;"/>
        <p>A social marketplace platform based on the principle of the collaborative economy</p>
    </header>

    <nav class="main-nav">
        <ul>
            <li><a href="index.html" class="active">Product Catalog</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>

    <div class="container">
        
        <!-- Semantic tag: aside for the sidebar filter -->
        <aside class="filter-sidebar">
            <h3>Advanced Search</h3>
            <!-- Asynchronous filter form (Ajax/Fetch) -->
            <form id="advanced-filter-form">
                <div class="form-group">
                    <label for="filter-category">Category:</label>
                    <select id="filter-category" name="categoryId">
                        <option value="">All Categories</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="filter-radius">Maximum Distance (km):</label>
                    <input type="number" id="filter-radius" name="radius" placeholder="e.g., 15" min="1">
                </div>

                <div class="form-group">
                    <label for="filter-status">Item Status:</label>
                    <select id="filter-status" name="status">
                        <option value="available">Available Only</option>
                        <option value="all">All (Including Requested/Delivered)</option>
                    </select>
                </div>

                <button type="submit" class="btn">Search Products</button>
            </form>
        </aside>

        <!-- Semantic tag: main for the central content -->
        <main class="main-content">
            
            <!-- HTML5 Component: Video on the home page with an explanatory video (Instructions requirement) -->
            <section id="video-section">
                <section id="expanded-video">
                    <video id="promo-video" autoplay muted poster="assets/video-placeholder.jpg">
                        <source src="./assets/סרטון תדמית ShareIt.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <button id="close-setup-player">
                        X
                    </button>
                </section>
                <button id="collapsed-reminder">
                    ^
                </button>
            </section>

            <!-- Semantic tag: section for the item catalog -->
            <section class="catalog-section">
                <h2>Products available in the community waiting for you</h2>
                <!-- The grid will be divided into multiple columns using CSS -->
                <div id="products-grid" class="products-grid">
                    <!-- Product cards will be dynamically injected here using JS/Fetch from the server -->
                </div>
            </section>

        </main>
    </div>

    <!-- Semantic tag: footer -->
    <footer class="main-footer">
        <p>&copy; 2026 ShareIt - Built as part of the Web Applications course</p>
    </footer>

    <style>
        #video-section {
            all: unset;
            width: max-content;
            height: max-content;
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 999;
            background: transparent;
        }
        
        #video-section > #expanded-video {
            width: max-content;
            height: max-content;
            padding: 5px;
            border-radius: 10px;
            background: #0005;
            /* default styles */
            display: none;
        }

        #video-section > #expanded-video > video {
            width: 280px;
            height: auto;
            border-radius: 5px;
        }

        #video-section > #expanded-video > #close-setup-player {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            bottom: calc(100% + .5rem);
            right: .5rem;
            padding: 0;
            background: transparent;
        }
        #video-section > #expanded-video > #close-setup-player:hover,
        #video-section > #expanded-video > #close-setup-player:click ,
        #video-section > #expanded-video > #close-setup-player:focus {
            background: transparent;
            transform: none;
            translate: none;
            box-shadow: none;
        }

        #video-section > #collapsed-reminder {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            /* default styles */
            display: none;
        }
    </style>

    <!-- Main JS file for catalog management and filtering -->
    <script src="js/constants/url.js"></script>
    <script src="js/main.js"></script>
    <script>
        const expandedVideo = document.getElementById('expanded-video')
        const collapsedReminder = document.getElementById('collapsed-reminder')
        const closeSetupPlayerBtn = document.getElementById('close-setup-player')

        // Add click event to close-setup-player button - collapses video
        closeSetupPlayerBtn.addEventListener('click', () => {
            expandedVideo.style.display = 'none';
            collapsedReminder.style.display = 'block';
            localStorage.setItem('isVideoPlayerCollapsed', 'true')
        })
        
        // Add click event to collapsed-reminder button - brings video back
        collapsedReminder.addEventListener('click', () => {
            expandedVideo.style.display = 'flex';
            collapsedReminder.style.display = 'none';
            localStorage.setItem('isVideoPlayerCollapsed', 'false')
        })

        // Determine setup-videpo-player state from localStorage
        document.addEventListener('DOMContentLoaded', () => {
            const isVideoPlayerCollapsed = localStorage.getItem('isVideoPlayerCollapsed') === 'true'
            collapsedReminder.style.display = isVideoPlayerCollapsed ? 'flex' : 'none'
            expandedVideo.style.display = isVideoPlayerCollapsed ? 'none' : 'flex'
        })
    </script>
</body>
</html>
