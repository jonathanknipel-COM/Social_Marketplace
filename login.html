<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareIt - Login</title>
    <link rel="stylesheet" href="css/auth-style.css">
</head>
<body>

    <header class="main-header">
        <h1>ShareIt</h1>
        <p>Log in to access your dashboard and manage shared items</p>
    </header>

    <nav class="main-nav">
        <ul>
            <li><a href="index.html">Product Catalog</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>

    <main class="container" style="justify-content: center; align-items: center; min-height: 55vh;">
        
        <section class="filter-sidebar" style="max-width: 420px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.06);">
            <h2 style="text-align: center; border-bottom: none; margin-bottom: 25px; font-size: 1.8rem; color: hsl(0, 0%, 100%);">
                Welcome Back
            </h2>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email" style="color: #475569;">Email Address</label>
                    <input type="email" id="login-email" name="email" placeholder="enter your email" required>
                </div>
                
                <div class="form-group" style="margin-bottom: 25px;">
                    <label for="login-password" style="color: #475569;">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="enter your password" required>
                </div>

                <button type="submit" class="btn" style="letter-spacing: 0.5px;">Log In</button>
            </form>
            
            <div id="login-message" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
            
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 25px 0;">
            
            <p style="text-align: center; margin: 0; font-size: 0.95rem; color: #64748b;">
                New to ShareIt? <a href="register.html" style="color: var(--secondary-color); text-decoration: none; font-weight: 700;">Create an account here</a>
            </p>
        </section>

    </main>

    <footer class="main-footer">
        <p>&copy; 2026 ShareIt - Built as part of the Web Applications Development course</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loginForm = document.getElementById("login-form");
            const loginMessage = document.getElementById("login-message");

            if (loginForm) {
                loginForm.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    
                    const formData = new FormData(loginForm);
                    const data = Object.fromEntries(formData.entries());
                    
                    try {
                        loginMessage.style.color = "var(--dark-color)";
                        loginMessage.textContent = "Authenticating...";

                        const response = await fetch('/api/users/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });

                        const result = await response.json();

                        if (response.ok) {
                            // נניח שהשרת מחזיר את פרטי המשתמש בתוך האובייקט result
                            localStorage.setItem('currentUser', JSON.stringify(result.user));
                            
                            loginMessage.textContent = "Login successful! Redirecting...";
                            setTimeout(() => { window.location.href = "profile.html"; }, 1500);
                        } else {
                            loginMessage.style.color = "var(--danger-color)";
                            loginMessage.textContent = result.message || "Invalid email or password.";
                        }
                    } catch (error) {
                        console.error("Login error:", error);
                        loginMessage.style.color = "var(--danger-color)";
                        loginMessage.textContent = "Server communication error.";
                    }
                });
            }
        });
    </script>
</body>
</html>
