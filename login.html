<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareIt - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Semantic Header Component -->
    <header class="main-header">
        <h1>ShareIt</h1>
        <p>Log in to access your personal profile and manage your donations</p>
    </header>

    <!-- Semantic Navigation Component -->
    <nav class="main-nav">
        <ul>
            <li><a href="index.html">Product Catalog</a></li>
            <li><a href="login.html" class="active">Login</a></li>
        </ul>
    </nav>

    <!-- Main Content Container for the Login Layout -->
    <main class="container login-layout" style="justify-content: center; align-items: center; min-height: 50vh;">
        
        <!-- Semantic section for the login form module -->
        <section class="filter-sidebar" style="max-width: 400px; width: 100%;">
            <h2 style="text-align: center; color: var(--primary-color); margin-bottom: 20px;">Welcome Back</h2>
            
            <!-- Asynchronous Form Submission Container -->
            <form id="login-form">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="login-email" style="display: block; margin-bottom: 5px; font-weight: bold;">Email Address:</label>
                    <input type="email" id="login-email" name="email" placeholder="e.g., user@example.com" required 
                           style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                </div>
                
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="login-password" style="display: block; margin-bottom: 5px; font-weight: bold;">Password:</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required 
                           style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                </div>

                <button type="submit" class="btn" style="width: 100%; padding: 12px; font-size: 1rem;">Sign In</button>
            </form>
            
            <div id="login-message" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
        </section>

    </main>

    <!-- Semantic Footer Component -->
    <footer class="main-footer">
        <p>&copy; 2026 ShareIt - Built as part of the Web Applications Development course</p>
    </footer>

    <!-- Script to handle asynchronous login request validation -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loginForm = document.getElementById("login-form");
            const loginMessage = document.getElementById("login-message");

            if (loginForm) {
                loginForm.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    
                    const formData = new FormData(loginForm);
                    const data = Object.fromEntries(formData.entries());
                    
                    try {
                        loginMessage.style.color = "var(--dark-color)";
                        loginMessage.textContent = "Authenticating...";

                        // Asynchronous fetch call to your backend Express server authentication endpoint
                        const response = await fetch('/api/users/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(data)
                        });

                        const result = await response.json();

                        if (response.ok) {
                            loginMessage.style.color = "var(--primary-color)";
                            loginMessage.textContent = "Login successful! Redirecting to your dashboard...";
                            
                            // Redirect user to the personal dashboard page upon successful verification
                            setTimeout(() => {
                                window.location.href = "profile.html";
                            }, 1500);
                        } else {
                            // Display error messages from the backend response logic
                            loginMessage.style.color = "#e74c3c";
                            loginMessage.textContent = result.message || "Invalid credentials. Please try again.";
                        }
                    } catch (error) {
                        console.error("Authentication process error:", error);
                        loginMessage.style.color = "#e74c3c";
                        loginMessage.textContent = "Server communication error. Failed to authenticate.";
                    }
                });
            }
        });
    </script>
</body>
</html>
